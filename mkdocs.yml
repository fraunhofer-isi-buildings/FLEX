site_name: FLEX Model Docs
site_description: Documentation for the FLEX behavior-operation-community modeling framework
repo_name: FLEX_cnb
site_dir: site
use_directory_urls: false

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Model Architecture: model-architecture.md
  - Behavior Model: behavior-model.md
  - Operation Model: operation-model.md
  - Community Model: community-model.md
  - Project Overview: project-overview.md
